name: Build Ginkgo KernelSU Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev lz4 python3 device-tree-compiler cpio zip unzip xz-utils zstd clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Baixar Kernel Android 17 e AnyKernel3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo clone LineageOS/android_kernel_xiaomi_sm6125 kernel -- --depth=1
          gh repo clone osm0sis/AnyKernel3 anykernel -- --depth=1 -b master

      - name: Integrar KernelSU Next
        working-directory: kernel
        run: |
          BASE="https://githubusercontent.com"
          PATH_KSU="KernelSU-Next/KernelSU-Next/next/kernel/setup.sh"
          curl -LSs "$BASE/$PATH_KSU" | bash -s v1.1.1

      - name: Compilar Kernel
        working-directory: kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          if [ -f arch/arm64/configs/vendor/ginkgo-perf_defconfig ]; then
            make O=out ARCH=arm64 vendor/ginkgo-perf_defconfig
          elif [ -f arch/arm64/configs/vendor/xiaomi/ginkgo.config ]; then
            make O=out ARCH=arm64 vendor/trinket-perf_defconfig vendor/xiaomi/xiaomi.config vendor/xiaomi/trinket.config vendor/xiaomi/ginkgo.config
          else
            make O=out ARCH=arm64 ginkgo_defconfig
          fi
          scripts/config --file out/.config -e KSU
          make O=out ARCH=arm64 olddefconfig
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- KCFLAGS="-Wno-error" Image.gz-dtb

      - name: Empacotar AnyKernel3 ZIP
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' anykernel/anykernel.sh
          sed -i 's/block=\/dev\/block\/platform\/omap\/omap_hsmmc.0\/by-name\/boot;/block=auto;/g' anykernel/anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' anykernel/anykernel.sh
          cd anykernel
          zip -r9 ../Ginkgo-A17-KSUNext.zip * -x .git README.md *placeholder

      - name: Upload do ZIP compilado
        uses: actions/upload-artifact@v4
        with:
          name: Ginkgo-A17-KSUNext
          path: Ginkgo-A17-KSUNext.zip
