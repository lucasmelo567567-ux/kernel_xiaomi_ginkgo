name: Build Ginkgo KernelSU Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev libelf-dev lz4 python3 device-tree-compiler cpio zip unzip xz-utils zstd clang lld llvm gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Baixar Kernel Android 17, AOSP Clang e AnyKernel3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh repo clone LineageOS/android_kernel_xiaomi_sm6125 kernel -- --depth=1
          gh repo clone osm0sis/AnyKernel3 anykernel -- --depth=1 -b master
          mkdir -p clang
          CLANG_HOST="https://android.googlesource.com"
          CLANG_PATH="platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r530567.tar.gz"
          curl -LSs "$CLANG_HOST/$CLANG_PATH" -o clang.tar.gz
          tar -xzf clang.tar.gz -C clang

      - name: Integrar KernelSU Next e patches
        working-directory: kernel
        run: |
          BASE="https://raw.githubusercontent.com"
          PATH_KSU="KernelSU-Next/KernelSU-Next/next/kernel/setup.sh"
          curl -LSs "$BASE/$PATH_KSU" | bash -s v1.1.1
          sed -i '15s|^|// |' arch/arm64/boot/dts/xiaomi/qcom-base/trinket-thermal-overlay.dtsi || true
          python3 -c '
          p = "fs/namespace.c"
          s = open(p).read()
          code = "\nstatic int can_umount(const struct path *path, int flags)\n{\n\tstruct mount *mnt = real_mount(path->mnt);\n\tif (flags & ~(MNT_FORCE | MNT_DETACH | MNT_EXPIRE | UMOUNT_NOFOLLOW))\n\t\treturn -EINVAL;\n\tif (!may_mount())\n\t\treturn -EPERM;\n\tif (path->dentry != path->mnt->mnt_root)\n\t\treturn -EINVAL;\n\tif (!check_mnt(mnt))\n\t\treturn -EINVAL;\n\tif (mnt->mnt.mnt_flags & MNT_LOCKED)\n\t\treturn -EINVAL;\n\tif (flags & MNT_FORCE && !capable(CAP_SYS_ADMIN))\n\t\treturn -EPERM;\n\treturn 0;\n}\nint path_umount(struct path *path, int flags)\n{\n\tstruct mount *mnt = real_mount(path->mnt);\n\tint ret = can_umount(path, flags);\n\tif (!ret)\n\t\tret = do_umount(mnt, flags);\n\tdput(path->dentry);\n\tmntput_no_expire(mnt);\n\treturn ret;\n}\n"
          if "int path_umount" not in s: open(p, "w").write(s + code)
          '

      - name: Compilar Kernel Image.gz-dtb
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          GINKGO_CFG=$(cd arch/arm64/configs && find . -name "*ginkgo*" | head -n 1 | sed 's|^\./||')
          make O=out ARCH=arm64 vendor/trinket-perf_defconfig $GINKGO_CFG
          scripts/config --file out/.config -e COMPAT -e KSU
          make O=out ARCH=arm64 olddefconfig
          make -j2 O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image.gz-dtb

      - name: Empacotar AnyKernel3 ZIP pronto para flash
        run: |
          cp kernel/out/arch/arm64/boot/Image.gz-dtb anykernel/
          sed -i 's|BLOCK=.*;|BLOCK=/dev/block/bootdevice/by-name/boot;|g' anykernel/anykernel.sh
          sed -i 's|IS_SLOT_DEVICE=.*;|IS_SLOT_DEVICE=0;|g' anykernel/anykernel.sh
          sed -i '/# init.rc/,/fstab;/d' anykernel/anykernel.sh
          cd anykernel
          zip -r9 ../Ginkgo-A17-KSUNext-BOOTABLE.zip * -x .git README.md *placeholder

      - name: Upload do ZIP compilado
        uses: actions/upload-artifact@v4
        with:
          name: Ginkgo-A17-KSUNext-BOOTABLE
          path: Ginkgo-A17-KSUNext-BOOTABLE.zip
